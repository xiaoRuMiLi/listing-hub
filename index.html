<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>listing-hub · 设计文档</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e6e8eb;--ink:#1f2328;--muted:#6b7280;--brand:#0b7a5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#0f172a;color:#e5e7eb;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header b{color:#fff}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{border:1px solid #334155;background:#1e293b;color:#cbd5e1;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
  nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .right{margin-left:auto;font-size:12px;color:#94a3b8}
  main{max-width:980px;margin:22px auto 80px;padding:0 16px}
  .doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 30px;box-shadow:0 2px 14px rgba(0,0,0,.04)}
  .doc h1{font-size:24px;border-bottom:2px solid var(--line);padding-bottom:10px;margin-top:0}
  .doc h2{font-size:19px;margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .doc h3{font-size:16px;margin-top:22px}
  .doc table{border-collapse:collapse;width:100%;font-size:13px;margin:12px 0;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .doc th{background:#f3f5f7;white-space:nowrap}
  .doc code{background:#f0f2f5;padding:1px 6px;border-radius:5px;font-size:12.5px}
  .doc pre{background:#0f172a;color:#cbd5e1;padding:12px 14px;border-radius:8px;overflow:auto;font-size:12.5px}
  .doc pre code{background:none;padding:0}
  .doc blockquote{margin:12px 0;padding:6px 14px;border-left:4px solid #cbd5e1;color:var(--muted);background:#fafbfc}
  .doc ul,.doc ol{padding-left:22px}
  .doc a{color:#0b6bcb}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <b>📦 listing-hub 设计文档</b>
  <nav id="tabs"></nav>
  <span class="right" id="status"></span>
</header>
<main><article class="doc" id="doc">加载中…</article></main>
<script>
const DOCS = [
  ["ARCHITECTURE.md", "① 架构设计"],
  ["DATABASE.md", "② 数据库表结构"],
  ["API.md", "③ API 接口设计"],
  ["CONFIG.md", "④ 配置项设计"],
  ["NEEDS.md", "⑤ 开工清单"],
  ["CONFIG-FILL.md", "⑥ 配置填写清单"],
  ["SAMPLES.md", "⑦ 样本与字段映射"],
  ["DEPLOY-BAOTA.md", "⑧ 宝塔部署手册"],
  ["DESIGN-DISCUSSION.md", "决策日志（已归档）"]
];
const tabs = document.getElementById('tabs');
const docEl = document.getElementById('doc');
const statusEl = document.getElementById('status');
function renderFallback(text){ docEl.innerHTML = ''; const pre = document.createElement('pre'); pre.textContent = text; docEl.appendChild(pre); }
async function load(file){
  [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.f === file));
  statusEl.textContent = '加载 ' + file + ' …';
  try{
    const r = await fetch(file + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const md = await r.text();
    if(window.marked){ docEl.innerHTML = marked.parse(md); }
    else { renderFallback(md); }
    statusEl.textContent = file + ' · ' + md.length + ' 字符';
    window.scrollTo({top:0});
  }catch(e){
    docEl.innerHTML = '<p style="color:#b91c1c">加载失败：' + e.message + '</p><p class="muted">（若 marked 没加载出来也会走这段；可直接访问源文件 /' + file + '）</p>';
    statusEl.textContent = '失败';
  }
}
DOCS.forEach(([f,label]) => {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.f = f; b.onclick = () => load(f);
  tabs.appendChild(b);
});
load(DOCS[0][0]);
</script>
</body>
</html>
